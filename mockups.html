<header class="py-5">
  <div class="container">
    <h1 class="display-5 fw-bold">All mockups</h1>
    <p class="lead muted">Free ones are tagged Free. Premium ones have a gold crown.</p>
    <form id="search" class="input-group input-group-lg my-4" role="search">
      <input id="q" class="form-control" type="search" placeholder="Try: woman, white tee, outdoors" aria-label="Search mockups">
      <button class="btn btn-accent px-4" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
    <div class="row g-3 filters">
      <div class="col-6 col-md-3"><label class="form-label small muted" for="f-price">Price</label><select id="f-price" class="form-select" data-k="price"><option value="all">All</option><option value="free">Free</option><option value="premium">Premium</option></select></div>
      <div class="col-6 col-md-3"><label class="form-label small muted" for="f-collection">Collection</label><select id="f-collection" class="form-select" data-k="collection"><option value="all">All collections</option></select></div>

      <div class="col-6 col-md-3"><label class="form-label small muted" for="f-product">Product</label><select id="f-product" class="form-select" data-k="product"><option value="all">All products</option></select></div>
    </div>
    <button id="f-new" class="chip mt-3">New</button>
  </div>
